<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipkart Replica</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; padding:20px; background:#faf9f6; font-family:Arial,Helvetica,sans-serif; color:#000}

  .top{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px}
  .brand{font-size:28px; font-weight:700; font-style:italic; color:#2874f0; text-decoration:none}
  .brand span{display:inline-block; margin-left:8px; padding:2px 8px; background:#ffe500; color:#2874f0; border-radius:6px; font-size:20px}
  .back{color:#2874f0; font-size:15px}

  .search{
    display:block; width:100%; max-width:1010px; margin:28px 0 36px; padding:14px 8px;
    border:2px solid #6bb4d6; border-radius:8px; font-size:15px; background:#fff;
  }
  .search:focus{outline:none; border-color:#2874f0}

  .products{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:32px}
  .product img,.product .ph{
    display:block; width:200px; height:250px; object-fit:cover; border-radius:20px;
    background:linear-gradient(135deg,#ddd,#bbb);
  }
  .product h3{margin:24px 0 0; font-size:20px}
  .product h3 small{font-size:14px; color:#666; font-weight:700; margin-left:2px}
  .price{font-size:19px; font-weight:700; margin:18px 0}
  .rating{display:inline-block; padding:2px 4px; background:#008000; color:#fff; font-size:15px; font-weight:700; border-radius:4px}
  .count{margin-left:6px; font-size:17px}
  .empty{display:none; color:#666; font-size:18px}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="#">Flipkart<span>f</span></a>
  <a class="back" href="../portfolio.html">Back to portfolio</a>
</div>

<input class="search" id="search" type="search" placeholder="Search for Products, Brands and More" aria-label="Search products">

<div class="products" id="products">

  <div class="product">
    <img src="Images/iphone.jpg" alt="Apple iPhone 17">
    <h3>Apple <small>iPhone 17 (256GB)</small></h3>
    <div class="price">$999</div>
    <span class="rating">4.6★</span><span class="count">(26,971)</span>
  </div>

  <div class="product">
    <img src="Images/bangles.jpg" alt="BlueStone gold bangles">
    <h3>BlueStone <small>Gold Bangles</small></h3>
    <div class="price">$199</div>
    <span class="rating">4.3★</span><span class="count">(12,345)</span>
  </div>

  <div class="product">
    <img src="Images/basket.jpg" alt="Handicraft wicker basket">
    <h3>Handicraft <small>Wicker Basket</small></h3>
    <div class="price">$49</div>
    <span class="rating">4.1★</span><span class="count">(8,765)</span>
  </div>

  <div class="product">
    <img src="Images/rm.jpg" alt="Adidas Real Madrid jersey">
    <h3>Adidas <small>Real Madrid Emerald Green Jersey</small></h3>
    <div class="price">$115</div>
    <span class="rating">4.0★</span><span class="count">(5,432)</span>
  </div>

</div>
<p class="empty" id="empty">No products match your search.</p>

<script>
  const search = document.getElementById('search');
  const cards = document.querySelectorAll('.product');
  const empty = document.getElementById('empty');

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(card => {
      const match = card.textContent.toLowerCase().includes(q);
      card.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  });
</script>

</body>
</html>
